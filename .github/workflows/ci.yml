name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '26'

jobs:
  quality:
    name: Lint, tipos y auditoría
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

  test:
    name: Unitarias, arquitectura, integración y E2E (PostgreSQL real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: tracking_notifier_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d tracking_notifier_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL_TEST: postgresql://ci:ci_only_password@localhost:5432/tracking_notifier_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Todas las pruebas (un solo comando) con cobertura
        run: npm run test:cov

  docker-e2e:
    name: docker compose up + smoke post-despliegue
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: docker/setup-buildx-action@v4
      - name: Levantar el stack
        run: docker compose up -d --build --wait
      - name: Smoke / E2E post-despliegue
        run: npm run test:smoke
      - name: Verificar que los logs no contienen datos personales
        run: |
          docker compose logs app > app.log
          if grep -q "Dato ficticio smoke" app.log; then echo "Se encontró PII en logs"; exit 1; fi
          if grep -q "whsec_" app.log; then echo "Se encontró un secreto en logs"; exit 1; fi
      - name: Logs ante fallo
        if: failure()
        run: |
          docker compose ps
          docker compose logs
          # Últimos errores del servicio como anotaciones (sin datos sensibles: los logs ya vienen redactados)
          docker compose logs --no-color app | grep -E '"severity":"(ERROR|WARNING|CRITICAL)"' | tail -n 5 | sed 's/^/::warning title=app log::/' || true
      - name: Bajar el stack
        if: always()
        run: docker compose down -v
