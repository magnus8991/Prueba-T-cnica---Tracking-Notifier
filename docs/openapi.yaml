openapi: 3.1.0
info:
  title: tracking-notifier
  version: 1.0.0
  description: |
    Microservicio multi-tenant que registra cambios de estado de guías de envío y notifica
    al webhook de cada cliente (Transactional Outbox, reintentos con backoff, firma HMAC).

    **Tenant:** todas las rutas de negocio exigen la cabecera `X-Tenant-Id` (validada previamente por el API Gateway).
    **Errores:** formato único RFC 9457 (`application/problem+json`).
    **Webhook saliente:** ver `webhooks.guiaEstadoActualizado`.
servers:
  - url: http://localhost:8080
    description: docker compose local
tags:
  - name: Guías
  - name: Webhook
  - name: Notificaciones
  - name: Operación

paths:
  /v1/guias/{numeroGuia}/eventos:
    post:
      tags: [Guías]
      summary: Registrar evento de estado de una guía
      description: |
        Idempotente por `eventId` (por tenant). La notificación al webhook se encola en la misma
        transacción y se envía de forma asíncrona: la respuesta no espera al webhook.
      operationId: registrarEvento
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/NumeroGuia'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrarEventoRequest' }
            example:
              eventId: 3f6b2c1e-8a4d-4f7e-9b1a-2c3d4e5f6a7b
              estado: EN_RUTA
              fechaEvento: '2026-11-18T10:15:00-05:00'
              observacion: Salió del centro de distribución
      responses:
        '201':
          description: Evento registrado
          headers:
            Location: { schema: { type: string }, description: Recurso de la guía }
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventoRegistrado' }
        '200':
          description: Repetición idempotente (mismo eventId y mismo contenido); no se generan efectos nuevos
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ['true'] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventoRegistrado' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: |
            `GUIA_EN_ESTADO_TERMINAL` (la guía está ENTREGADA o DEVUELTA) o
            `EVENT_ID_CONFLICTO` (eventId reutilizado con otro contenido).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                type: https://tracking-notifier.domina.dev/problemas/guia-en-estado-terminal
                title: Conflicto con el estado del recurso
                status: 409
                detail: La guía GUIA-0001 está ENTREGADA y no admite más cambios de estado
                instance: /v1/guias/GUIA-0001/eventos
                code: GUIA_EN_ESTADO_TERMINAL
                requestId: 0b6f0c7e-2a0c-4f7a-9a51-6a2b9c0d1e2f
        '413': { $ref: '#/components/responses/Problem' }
        '415': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }

  /v1/guias/{numeroGuia}:
    get:
      tags: [Guías]
      summary: Consultar estado actual e historial cronológico
      operationId: consultarHistorial
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/NumeroGuia'
      responses:
        '200':
          description: Estado actual y eventos ordenados por fechaEvento (desempate por orden de llegada)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistorialGuia' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: La guía no existe para este tenant (no se distingue de una guía de otro tenant)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /v1/webhook:
    put:
      tags: [Webhook]
      summary: Crear o actualizar la URL del webhook del tenant
      description: |
        Al crearse (o con `rotarSecreto: true`) se genera un secreto HMAC que **se muestra una única vez**.
        En producción la URL debe ser https y no puede apuntar a redes privadas/metadata (protección SSRF).
      operationId: configurarWebhook
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigurarWebhookRequest' }
            example: { url: 'https://cliente.example.com/webhooks/guias' }
      responses:
        '201':
          description: Webhook creado (incluye `secreto`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '200':
          description: Webhook actualizado (incluye `secreto` solo si se rotó)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Webhook]
      summary: Consultar la configuración del webhook (sin secreto)
      operationId: consultarWebhook
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Configuración actual
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/notificaciones:
    get:
      tags: [Notificaciones]
      summary: Listar notificaciones del tenant (las FALLIDA quedan consultables)
      operationId: listarNotificaciones
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: estado
          in: query
          schema: { $ref: '#/components/schemas/EstadoNotificacion' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Notificaciones (más recientes primero)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Notificacion' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/notificaciones/{id}:
    get:
      tags: [Notificaciones]
      summary: Detalle de una notificación con su historial de intentos
      operationId: consultarNotificacion
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/NotificacionId'
      responses:
        '200':
          description: Detalle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificacionDetalle' }
        '404': { $ref: '#/components/responses/Problem' }

  /v1/notificaciones/{id}/reintentar:
    post:
      tags: [Notificaciones]
      summary: Reencolar manualmente una notificación FALLIDA
      operationId: reintentarNotificacion
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/NotificacionId'
      responses:
        '202':
          description: Reencolada (estado PENDIENTE, contador reiniciado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notificacion' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: '`NOTIFICACION_NO_REINTENTABLE`: solo se reintentan notificaciones FALLIDA (con reintentos concurrentes, solo uno es aceptado)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /health/live:
    get:
      tags: [Operación]
      summary: Liveness
      responses:
        '200': { description: El proceso responde }
  /health/ready:
    get:
      tags: [Operación]
      summary: Readiness (verifica la base de datos)
      responses:
        '200': { description: Listo para recibir tráfico }
        '503': { $ref: '#/components/responses/Problem' }
  /metrics:
    get:
      tags: [Operación]
      summary: Métricas Prometheus
      responses:
        '200':
          description: Formato de exposición de Prometheus
          content:
            text/plain: { schema: { type: string } }

webhooks:
  guiaEstadoActualizado:
    post:
      summary: Notificación enviada al webhook del cliente por cada evento aceptado
      description: |
        Entrega *at-least-once*: deduplique por `webhook-id` (= eventId).
        Verifique la firma (Standard Webhooks v1): `base64(HMAC-SHA256(base64decode(secreto sin "whsec_"), "{webhook-id}.{webhook-timestamp}.{cuerpo}"))`
        y rechace timestamps muy antiguos (replay). Responda 2xx en menos de 5 s; cualquier otro resultado
        se reintenta hasta 5 intentos con espera exponencial creciente.
      parameters:
        - { name: webhook-id, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: webhook-timestamp, in: header, required: true, schema: { type: string, description: Unix epoch en segundos } }
        - { name: webhook-signature, in: header, required: true, schema: { type: string, example: 'v1,K5oZfzN95Z9UVu1EsfQmfVNQhnkZ2pj9o9NDN/H/pI4=' } }
        - { name: x-delivery-attempt, in: header, required: true, schema: { type: integer, minimum: 1, maximum: 5 } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookPayload' }
      responses:
        '2XX': { description: Recibido }

components:
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Identificador del cliente, validado por el API Gateway
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$', example: banco-ficticio }
    NumeroGuia:
      name: numeroGuia
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9-]{1,40}$', example: GUIA-0001 }
    NotificacionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Id de correlación; si no se envía, el servicio genera uno y lo devuelve
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{8,128}$' }
  headers:
    RequestId:
      schema: { type: string }
  responses:
    BadRequest:
      description: Validación fallida (`VALIDACION_FALLIDA`, `TENANT_INVALIDO`, `JSON_MALFORMADO`, `FECHA_EVENTO_FUTURA`, `URL_WEBHOOK_INVALIDA`, `URL_WEBHOOK_NO_PERMITIDA`, ...)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://tracking-notifier.domina.dev/problemas/validacion-fallida
            title: Petición inválida
            status: 400
            detail: La petición no es válida
            instance: /v1/guias/GUIA-0001/eventos
            code: VALIDACION_FALLIDA
            errors:
              - { path: fechaEvento, message: 'fechaEvento debe ser ISO 8601 con zona horaria (ej. 2026-11-18T10:00:00-05:00)' }
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    EstadoGuia:
      type: string
      enum: [CREADA, EN_RUTA, ENTREGADA, DEVUELTA]
      description: ENTREGADA y DEVUELTA son terminales
    EstadoNotificacion:
      type: string
      enum: [PENDIENTE, ENVIANDO, ENVIADA, FALLIDA]
    RegistrarEventoRequest:
      type: object
      additionalProperties: false
      required: [eventId, estado, fechaEvento]
      properties:
        eventId: { type: string, format: uuid, description: Llave de idempotencia }
        estado: { $ref: '#/components/schemas/EstadoGuia' }
        fechaEvento: { type: string, format: date-time, description: ISO 8601 con zona horaria }
        observacion: { type: [string, 'null'], maxLength: 500 }
    Evento:
      type: object
      required: [eventId, numeroGuia, estado, fechaEvento, observacion, recibidoEn]
      properties:
        eventId: { type: string, format: uuid }
        numeroGuia: { type: string }
        estado: { $ref: '#/components/schemas/EstadoGuia' }
        fechaEvento: { type: string, format: date-time }
        observacion: { type: [string, 'null'] }
        recibidoEn: { type: string, format: date-time }
    EventoRegistrado:
      allOf:
        - $ref: '#/components/schemas/Evento'
        - type: object
          required: [estadoActualGuia]
          properties:
            estadoActualGuia: { $ref: '#/components/schemas/EstadoGuia' }
    HistorialGuia:
      type: object
      required: [numeroGuia, estadoActual, fechaEstadoActual, eventos]
      properties:
        numeroGuia: { type: string }
        estadoActual: { $ref: '#/components/schemas/EstadoGuia' }
        fechaEstadoActual: { type: string, format: date-time }
        eventos:
          type: array
          items: { $ref: '#/components/schemas/Evento' }
    ConfigurarWebhookRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
        rotarSecreto: { type: boolean, default: false }
    Webhook:
      type: object
      required: [url, algoritmoFirma, creadoEn, actualizadoEn]
      properties:
        url: { type: string, format: uri }
        secreto:
          type: string
          description: Solo presente al crear o rotar. Guárdelo de forma segura; no se vuelve a mostrar.
          example: whsec_MfKQ9r8GKYqrTwjUPD8ILPZIo2LaLaSw
        algoritmoFirma: { type: string }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
    Notificacion:
      type: object
      required: [id, eventId, estado, intentos, maxIntentos]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        estado: { $ref: '#/components/schemas/EstadoNotificacion' }
        intentos: { type: integer }
        maxIntentos: { type: integer }
        proximoIntentoEn: { type: [string, 'null'], format: date-time }
        ultimoError:
          type: [string, 'null']
          enum: [TIMEOUT, HTTP_ERROR, NETWORK_ERROR, DESTINO_NO_PERMITIDO, WEBHOOK_NO_CONFIGURADO, LEASE_EXPIRADO, null]
        ultimoHttpStatus: { type: [integer, 'null'] }
        entregadaEn: { type: [string, 'null'], format: date-time }
        fallidaEn: { type: [string, 'null'], format: date-time }
        creadaEn: { type: string, format: date-time }
        actualizadaEn: { type: string, format: date-time }
    NotificacionDetalle:
      allOf:
        - $ref: '#/components/schemas/Notificacion'
        - type: object
          properties:
            historialIntentos:
              type: array
              items:
                type: object
                properties:
                  intento: { type: integer }
                  fecha: { type: string, format: date-time }
                  duracionMs: { type: integer }
                  httpStatus: { type: [integer, 'null'] }
                  error: { type: [string, 'null'] }
    WebhookPayload:
      type: object
      required: [type, eventId, numeroGuia, estado, fechaEvento, observacion, recibidoEn]
      properties:
        type: { type: string, const: guia.estado_actualizado }
        eventId: { type: string, format: uuid }
        numeroGuia: { type: string }
        estado: { $ref: '#/components/schemas/EstadoGuia' }
        fechaEvento: { type: string, format: date-time }
        observacion: { type: [string, 'null'] }
        recibidoEn: { type: string, format: date-time }
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status, detail, instance, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: Código estable para manejo programático }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path: { type: string }
              message: { type: string }
